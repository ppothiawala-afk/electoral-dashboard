*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100vh;background:#f8f9fb}
body{font-family:'Inter','Segoe UI',sans-serif;color:#1a1a2e;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#f0f0f5}
::-webkit-scrollbar-thumb{background:#c8c8d8;border-radius:3px}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.fade-up{animation:fadeUp .4s ease both}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}.stagger-4{animation-delay:.2s}
.live-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:pulse 2s ease infinite;display:inline-block}
.hover-lift{transition:transform .18s,box-shadow .18s}
.hover-lift:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}

/* Mobile */
@media(max-width:680px){
  .stat-row{flex-direction:column!important}
  .two-col{grid-template-columns:1fr!important}
  .three-col{grid-template-columns:1fr!important}
  .race-row-grid{grid-template-columns:44px 1fr 100px!important}
  .race-row-district{display:none!important}
  .race-row-note{display:none!important}
  .header-inner{flex-direction:column!important;align-items:flex-start!important;gap:6px!important}
  .tab-bar{overflow-x:auto;padding-bottom:4px}
  .filter-bar{overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap!important}
  .map-wrap{display:none}
}
@media(max-width:900px){
  .three-col{grid-template-columns:1fr 1fr!important}
}
</style>

// Compact state position grid for a schematic map (col, row) in a 12×8 grid
const STATE_GRID = {
  AK:[0,7], HI:[1,7],
  WA:[1,0], ID:[2,1], MT:[3,0], ND:[4,0], MN:[5,0], WI:[6,1], MI:[7,1], VT:[9,0], NH:[10,0], ME:[11,0],
  OR:[1,1], NV:[2,2], WY:[3,1], SD:[4,1], IA:[5,1], IL:[6,2], IN:[7,2], OH:[8,2], PA:[9,2], NY:[10,1], CT:[10,2], RI:[11,2],
  CA:[1,2], UT:[2,3], CO:[3,2], NE:[4,2], MO:[5,2], KY:[7,3], WV:[8,3], VA:[9,3], MD:[10,3], DE:[11,3], NJ:[11,4],
  AZ:[2,4], NM:[3,3], KS:[4,3], AR:[5,3], TN:[7,4], NC:[9,4],
  TX:[3,4], OK:[4,4], LA:[5,4], MS:[6,4], AL:[7,5], GA:[8,5], SC:[9,5],
  FL:[8,6],
};

function SchematicMap({senate, governors, house, mapMode}) {
  const [tooltip, setTooltip] = React.useState(null);

  const stateRatings = useMemo(() => {
    const map = {};
    if (mapMode === "senate") {
      senate.forEach(r => { map[r.state] = r.rating; });
    } else if (mapMode === "governors") {
      governors.forEach(r => { map[r.state] = r.rating; });
    } else if (mapMode === "house") {
      // For House map, use the most competitive rating per state
      const priority = ["Toss-up","Lean D","Lean R","Likely D","Likely R","Solid D","Solid R"];
      house.forEach(r => {
        const existing = map[r.state];
        if (!existing || priority.indexOf(r.rating) < priority.indexOf(existing)) {
          map[r.state] = r.rating;
        }
      });
    }
    return map;
  }, [senate, governors, house, mapMode]);

  const cellW = 38, cellH = 38, pad = 4;
  const cols = 12, rows = 8;
  const W = cols * (cellW + pad) + pad;
  const H = rows * (cellH + pad) + pad;

  return (
    <div style={{position:"relative"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:520,display:"block",margin:"0 auto",background:"#fff",borderRadius:8}}>
        <rect x={0} y={0} width={W} height={H} fill="#fff"/>
        {Object.entries(STATE_GRID).map(([st,[col,row]]) => {
          const rating = stateRatings[st];
          const notOnBallot = !rating;
          const fill = rating ? MAP_COLORS[rating] : "#f0f0f5";
          const x = pad + col*(cellW+pad);
          const y = pad + row*(cellH+pad);
          const isCompetitive = rating && ["Lean D","Toss-up","Lean R"].includes(rating);
          const textColor = notOnBallot ? "#9ca3af"
            : rating === "Lean D" ? "#1e3a8a"
            : rating === "Lean R" ? "#7f1d1d"
            : ["Solid D","Likely D","Toss-up","Likely R","Solid R"].includes(rating) ? "#fff"
            : "#4b5563";
          return (
            <g key={st}
              onMouseEnter={() => setTooltip({st, rating: rating||null, notOnBallot})}
              onMouseLeave={() => setTooltip(null)}
              style={{cursor:"default"}}
            >
              <rect x={x} y={y} width={cellW} height={cellH} rx={5}
                fill={fill}
                stroke={isCompetitive ? "#92400e" : notOnBallot ? "#e0e0e8" : "#fff"}
                strokeWidth={isCompetitive ? 2 : 1}
                opacity={notOnBallot ? 0.5 : 1}
              />
              <text x={x+cellW/2} y={y+cellH/2+4} textAnchor="middle"
                style={{fontSize:"10px",fontWeight: notOnBallot ? "400" : "700",fontFamily:"Inter,sans-serif",
                  fill: textColor,
                  pointerEvents:"none", userSelect:"none"}}
              >{st}</text>
            </g>
          );
        })}
      </svg>
      {tooltip && (
        <div style={{position:"absolute",top:8,right:8,background:"#1a1a2e",color:"#fff",
          borderRadius:8,padding:"8px 12px",fontSize:11,fontWeight:600,pointerEvents:"none",
          boxShadow:"0 4px 16px rgba(0,0,0,.2)",zIndex:10,maxWidth:160}}>
          <div style={{fontSize:13,fontWeight:800}}>{STATE_NAMES[tooltip.st]||tooltip.st}</div>
          {tooltip.notOnBallot
            ? <div style={{marginTop:2,color:"#9ca3af",fontWeight:400}}>Not up in 2026</div>
            : <div style={{marginTop:2,color: RATING_COLORS[tooltip.rating]?.bg||"#888"}}>
                {tooltip.rating}
              </div>
          }
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   GOOGLE SHEETS FETCHER
   ═══════════════════════════════════════════════════════════════ */

async function fetchSheetData(url) {
  if (!url) return null;
  try {
    const resp = await fetch(url);
    const text = await resp.text();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true, dynamicTyping:true});
    return parsed.data;
  } catch(e) {
    console.warn("Failed to fetch sheet:", e);
    return null;
  }
}

function parseSenateSheet(rows) {
  return rows.map(r => ({
    state:(r.State||"").trim(), incumbent:(r.Incumbent||"").trim(), party:(r.Party||"").trim(),
    rating:(r.Rating||"").trim(), open:String(r.Open||"").toLowerCase()==="true"||r.Open===true,
    note:(r.Note||r.Notes||"").trim(), challenger:(r.Challenger||"").trim(),
    upIn2026:(r["Up in 2026"]||"").trim().toUpperCase(),
  })).filter(r=>r.state && r.upIn2026==="YES" && RATINGS.includes(r.rating));
}
function parseHouseSheet(rows) {
  return rows.map(r => ({
    state:(r.State||"").trim(), district:String(r.District||"").trim().padStart(2,"0"),
    incumbent:(r.Incumbent||"").trim(), party:(r.Party||"").trim(),
    rating:(r.Rating||"Solid R").trim(), note:(r.Note||r.Notes||"").trim(),
  })).filter(r=>r.state);
}
function parseGovSheet(rows) {
  return rows.map(r => ({
    state:(r.State||"").trim(), incumbent:(r.Incumbent||"").trim(), party:(r.Party||"").trim(),
    rating:(r.Rating||"").trim(), open:String(r.Open||"").toLowerCase()==="true"||r.Open===true,
    note:(r.Note||r.Notes||"").trim(),
    election2026:(r["Election 2026"]||r["Up in 2026"]||"").trim().toUpperCase(),
  })).filter(r => {
    if (!r.state) return false;
    // If the sheet has an Election 2026 / Up in 2026 column, use it to filter
    if (r.election2026 && r.election2026 !== "" && r.election2026 !== "YES") return false;
    // Only include rows with a valid rating
    return RATINGS.includes(r.rating);
  });
}
function parseConstantsSheet(rows) {
  // Constants tab has columns: Key, Value, Notes
  // Returns a flat object: {HOUSE_R: 217, HOUSE_D: 212, ...}
  const result = {};
  rows.forEach(r => {
    const key = (r.Key || r.key || Object.values(r)[0] || "").trim();
    const val = (r.Value !== undefined ? r.Value : Object.values(r)[1]);
    if (key) result[key] = val;
  });
  return result;
}

function parseStateLegSheet(rows) {
  return rows.map(r => ({
    state:(r.State||"").trim(), senateControl:(r.SenateControl||"").trim(),
    senateR:Number(r.SenateR)||0, senateD:Number(r.SenateD)||0,
    houseControl:(r.HouseControl||"").trim(), houseR:Number(r.HouseR)||0, houseD:Number(r.HouseD)||0,
    senateRating:(r.SenateRating||"Solid R").trim(), houseRating:(r.HouseRating||"Solid R").trim(),
  })).filter(r=>r.state);
}

   HELPERS
   ═══════════════════════════════════════════════════════════════ */

const ratingIndex = r => RATINGS.indexOf(r);
const isCompetitive = r => ["Lean D","Toss-up","Lean R"].includes(r);
const couldFlip = (rating, party) => {
  if(party==="R" && ratingIndex(rating)<=3) return "D";
  if(party==="D" && ratingIndex(rating)>=3) return "R";
  return null;
};

/* ═══════════════════════════════════════════════════════════════
   UI COMPONENTS
   ═══════════════════════════════════════════════════════════════ */

function RatingBadge({rating}) {
  const c = RATING_COLORS[rating] || {bg:"#9ca3af", text:"#fff"};
  return <span style={{
    display:"inline-block",padding:"3px 9px",borderRadius:"5px",fontSize:"11px",fontWeight:700,
    letterSpacing:"0.3px",color:c.text,backgroundColor:c.bg,whiteSpace:"nowrap",
  }}>{rating}</span>;
}

function PartyDot({party,size=10}) {
  return <span style={{
    display:"inline-block",width:size,height:size,borderRadius:"50%",flexShrink:0,
    backgroundColor:party==="D"?"#3b82f6":party==="R"?"#ef4444":"#a855f7",
    border:"1.5px solid rgba(0,0,0,0.1)",
  }}/>;
}

function StatBox({label,value,color,sub,delay=0}) {
  return <div className="fade-up hover-lift" style={{
    background:"#fff",borderRadius:12,padding:"18px 20px",
    borderLeft:`3px solid ${color}`,flex:1,minWidth:140,animationDelay:`${delay}s`,
    boxShadow:"0 1px 4px rgba(0,0,0,.06)",display:"flex",flexDirection:"column",justifyContent:"center",
  }}>
    <div style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"1px",marginBottom:6,fontWeight:600}}>{label}</div>
    <div style={{fontSize:28,fontWeight:800,color,fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{value}</div>
    {sub && <div style={{fontSize:11,color:"#9ca3af",marginTop:6}}>{sub}</div>}
  </div>;
}

function BarChart({d_count,r_count,total,label,majorityLine}) {
  const dPct = (d_count/total)*100;
  const rPct = (r_count/total)*100;
  const otherPct = Math.max(0, 100-dPct-rPct);
  const majPct = majorityLine ? (majorityLine/total)*100 : null;
  return <div style={{marginBottom:12}}>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:5,color:"#6b7280"}}>
      <span style={{color:"#1d4ed8",fontWeight:700}}>D: {d_count}</span>
      <span style={{fontWeight:600,color:"#9ca3af"}}>{label}</span>
      <span style={{color:"#b91c1c",fontWeight:700}}>R: {r_count}</span>
    </div>
    <div style={{position:"relative",height:24,borderRadius:8,overflow:"hidden",background:"#f3f4f6"}}>
      <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${dPct}%`,
        background:"linear-gradient(90deg,#1d4ed8,#3b82f6)",transition:"width .8s ease"}}/>
      {otherPct>0 && <div style={{position:"absolute",left:`${dPct}%`,top:0,bottom:0,width:`${otherPct}%`,
        background:"#e5e7eb"}}/>}
      <div style={{position:"absolute",right:0,top:0,bottom:0,width:`${rPct}%`,
        background:"linear-gradient(90deg,#ef4444,#b91c1c)",transition:"width .8s ease"}}/>
      {majPct && <div style={{position:"absolute",left:`${majPct}%`,top:-2,bottom:-2,width:2,
        background:"#d97706",zIndex:2,boxShadow:"0 0 6px rgba(217,119,6,.5)"}}/>}
    </div>
    {majorityLine && <div style={{fontSize:10,color:"#d97706",textAlign:"center",marginTop:3,fontWeight:700}}>
      ▲ {majorityLine} needed for majority
    </div>}
  </div>;
}

function RaceRow({race, showDistrict, idx=0}) {
  const flip = couldFlip(race.rating, race.party);
  const highlight = isCompetitive(race.rating);
  return <div className="hover-lift" style={{
    display:"grid",
    gridTemplateColumns:showDistrict?"52px 38px 1fr 100px 115px":"52px 1fr 100px 115px",
    gap:8,alignItems:"center",padding:"10px 14px",
    background:highlight?"#fffbeb":"#fff",
    borderRadius:8,
    borderLeft:highlight?`3px solid ${RATING_COLORS[race.rating]?.bg||"#e5e7eb"}`:"3px solid #f3f4f6",
    marginBottom:3,fontSize:13,transition:"background .15s",
    boxShadow:"0 1px 3px rgba(0,0,0,.04)",
  }}>
    <span style={{fontWeight:800,color:"#1a1a2e",fontFamily:"'JetBrains Mono',monospace",fontSize:13}}>{race.state}</span>
    {showDistrict && <span className="race-row-district" style={{color:"#9ca3af",fontSize:11,fontFamily:"'JetBrains Mono',monospace"}}>{race.district}</span>}
    <div style={{display:"flex",flexDirection:"column",gap:1,minWidth:0}}>
      <span style={{color:"#374151",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",fontWeight:500}}>{race.incumbent||"Open"}</span>
      {race.challenger && <span style={{fontSize:10,color:"#2563eb"}}>vs {race.challenger}</span>}
      {race.note && <span className="race-row-note" style={{fontSize:10,color:"#9ca3af",fontStyle:"italic"}}>{race.note}</span>}
    </div>
    <div style={{display:"flex",alignItems:"center",gap:5}}>
      <PartyDot party={race.party}/>
      <span style={{fontSize:11,color:"#6b7280"}}>{race.party}-held</span>
      {race.open && <span style={{fontSize:9,padding:"1px 5px",borderRadius:3,background:"#f3f4f6",color:"#6b7280",fontWeight:700}}>OPEN</span>}
    </div>
    <RatingBadge rating={race.rating}/>
  </div>;
}

function parseNewsSheet(rows) {
  if (!rows || !rows.length) return DEMO_NEWS;
  return rows.map(r => ({
    state:(r.State||"").trim(),
    raceType:(r.RaceType||"").trim(),
    sentiment:(r.Sentiment||"Mixed").trim(),
    sentimentScore: Number(r.SentimentScore)||50,
    sentimentSummary:(r.SentimentSummary||"").trim(),
    pollNote:(r.PollNote||"").trim(),
    articles:[
      r.Headline1 ? {headline:r.Headline1, url:r.URL1||"#", source:r.Source1||"", date:r.Date1||""} : null,
      r.Headline2 ? {headline:r.Headline2, url:r.URL2||"#", source:r.Source2||"", date:r.Date2||""} : null,
      r.Headline3 ? {headline:r.Headline3, url:r.URL3||"#", source:r.Source3||"", date:r.Date3||""} : null,
    ].filter(Boolean),
    onDeck: String(r.OnDeck||"").toLowerCase()==="true",
    onDeckNote:(r.OnDeckNote||"").trim(),
    lastUpdated:(r.LastUpdated||"").trim(),
  })).filter(r=>r.state);
}

// Sentiment color/label helpers
function sentimentColor(score) {
  if (score >= 60) return "#1d4ed8";
  if (score >= 55) return "#3b82f6";
  if (score >= 45) return "#d97706";
  if (score >= 40) return "#ef4444";
  return "#b91c1c";
}
function sentimentLabel(sentiment) {
  if (!sentiment) return "Mixed";
  return sentiment;
}

/* ═══════════════════════════════════════════════════════════════
   STATE NEWS — interactive per-state sentiment analysis
   Reads news_analysis.json (produced by the weekly Cowork routine
   via fetch_news.py + Claude scoring). sentiment = 0-100
   D-favorability of coverage tone. outletLean: -2 left … +2 right.
   ═══════════════════════════════════════════════════════════════ */

function StateNewsMap({analysis, selected, onSelect}) {
  const [hover, setHover] = useState(null);
  const cell = 44, gap = 4;
  const cols = 12, rows = 8;
  const has = st => !!(analysis && analysis.states && analysis.states[st]);
  const isBaseline = st => (analysis.states[st].races||[]).every(r=>r.baseline);
  const stateScore = st => {
    const races = analysis.states[st].races;
    return Math.round(races.reduce((a,r)=>a+r.sentiment,0)/races.length);
  };
  return (
    <svg viewBox={`0 0 ${cols*(cell+gap)} ${rows*(cell+gap)}`} style={{width:"100%",maxWidth:600}}>
      {Object.entries(STATE_GRID).map(([st,[c,r]]) => {
        const active = has(st);
        const fill = active ? sentimentColor(stateScore(st)) : "#e5e7eb";
        const isSel = selected === st;
        return (
          <g key={st} onClick={()=>active&&onSelect(st)}
             onMouseEnter={()=>setHover(st)} onMouseLeave={()=>setHover(null)}
             style={{cursor:active?"pointer":"default"}}>
            <rect x={c*(cell+gap)} y={r*(cell+gap)} width={cell} height={cell} rx={6}
              fill={fill} opacity={active ? (isSel||hover===st?1:(isBaseline(st)?0.5:0.85)) : 0.45}
              stroke={isSel?"#111827":"none"} strokeWidth={isSel?2.5:0}/>
            <text x={c*(cell+gap)+cell/2} y={r*(cell+gap)+cell/2+4} textAnchor="middle"
              fontSize={13} fontWeight={800}
              fill={active?"#fff":"#9ca3af"} style={{pointerEvents:"none"}}>{st}</text>
          </g>
        );
      })}
    </svg>
  );
}

function OutletScatter({outlets}) {
  const rated = (outlets||[]).filter(o => o.lean !== null && o.lean !== undefined);
  if (rated.length < 2) return (
    <div style={{fontSize:11,color:"#9ca3af",padding:"14px 0"}}>
      Not enough rated-outlet coverage yet for a lean-vs-sentiment plot.
    </div>
  );
  const W=460, H=210, padL=36, padR=16, padT=14, padB=30;
  const x = lean => padL + ((lean+2)/4)*(W-padL-padR);
  const y = s => padT + (1 - s/100)*(H-padT-padB);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W}}>
      {/* axes */}
      <line x1={padL} y1={y(50)} x2={W-padR} y2={y(50)} stroke="#e5e7eb" strokeDasharray="3,3"/>
      <line x1={x(0)} y1={padT} x2={x(0)} y2={H-padB} stroke="#e5e7eb" strokeDasharray="3,3"/>
      <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="#d1d5db"/>
      {[["Left",-2],["Lean L",-1],["Center",0],["Lean R",1],["Right",2]].map(([lab,v])=>(
        <text key={v} x={x(v)} y={H-padB+16} textAnchor="middle" fontSize={9} fill="#9ca3af" fontWeight={600}>{lab}</text>
      ))}
      <text x={10} y={y(80)} fontSize={9} fill="#3b82f6" fontWeight={700} transform={`rotate(-90 10 ${y(80)})`} textAnchor="middle">D-fav</text>
      <text x={10} y={y(20)} fontSize={9} fill="#ef4444" fontWeight={700} transform={`rotate(-90 10 ${y(20)})`} textAnchor="middle">R-fav</text>
      {/* points */}
      {rated.map((o,i)=>(
        <g key={i}>
          <circle cx={x(o.lean)} cy={y(o.sentiment)} r={5+Math.min(o.articles||1,4)}
            fill={sentimentColor(o.sentiment)} opacity={0.85}/>
          <text x={x(o.lean)} y={y(o.sentiment)-11} textAnchor="middle" fontSize={9}
            fill="#374151" fontWeight={600}>{o.source}</text>
        </g>
      ))}
    </svg>
  );
}

/* ── Election Calendar (Overview card) ───────────────────────────
   Reads election_calendar.json (maintained by the weekly routine).
   Auto-hides past events; clicking a state event jumps to its
   State News analysis. */
const CAL_KIND = {
  primary:    {label:"PRIMARY",    bg:"#fef3c7", fg:"#92400e"},
  runoff:     {label:"RUNOFF",     bg:"#fde68a", fg:"#78350f"},
  special:    {label:"SPECIAL",    bg:"#e0e7ff", fg:"#3730a3"},
  convention: {label:"CONVENTION", bg:"#f3e8ff", fg:"#6b21a8"},
  general:    {label:"ELECTION DAY", bg:"#dcfce7", fg:"#166534"},
};
function daysUntil(iso) {
  const d = new Date(iso + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}
function ElectionCalendar({calendar, newsAnalysis, onSelectState}) {
  if (!calendar || !calendar.events) return null;
  const upcoming = calendar.events
    .filter(e => daysUntil(e.date) >= 0)
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(0, 8);
  if (!upcoming.length) return null;
  return (
    <div className="fade-up" style={{background:"#fff",borderRadius:12,padding:20,boxShadow:"0 1px 4px rgba(0,0,0,.07)",marginTop:18}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <h3 style={{fontSize:11,fontWeight:700,color:"#6b7280",letterSpacing:"1px",textTransform:"uppercase",margin:0}}>
          🗓 Election Calendar
        </h3>
        <span style={{fontSize:10,color:"#9ca3af"}}>What's next on the road to Nov 3 · click a state for its news analysis</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {upcoming.map((e,i) => {
          const days = daysUntil(e.date);
          const kind = CAL_KIND[e.kind] || CAL_KIND.primary;
          const hasNews = e.state !== "US" && newsAnalysis?.states?.[e.state];
          const dt = new Date(e.date + "T00:00:00");
          return (
            <div key={i} onClick={() => hasNews && onSelectState(e.state)}
              className={hasNews ? "hover-lift" : ""}
              style={{display:"flex",alignItems:"center",gap:12,padding:"9px 12px",
                background: days <= 7 ? "#fffbeb" : "#f9fafb", borderRadius:8,
                border:"1px solid " + (days <= 7 ? "#fde68a" : "#f3f4f6"),
                cursor: hasNews ? "pointer" : "default"}}>
              <div style={{textAlign:"center",minWidth:44}}>
                <div style={{fontSize:9,fontWeight:700,color:"#9ca3af",textTransform:"uppercase"}}>
                  {dt.toLocaleDateString("en-US",{month:"short"})}
                </div>
                <div style={{fontSize:17,fontWeight:800,color:"#111827",lineHeight:1}}>
                  {dt.getDate()}
                </div>
              </div>
              <span style={{fontSize:9,fontWeight:800,padding:"3px 8px",borderRadius:10,
                background:kind.bg,color:kind.fg,letterSpacing:".5px",whiteSpace:"nowrap"}}>{kind.label}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,color:"#111827"}}>
                  {e.title}{hasNews && <span style={{color:"#3b82f6",fontWeight:600,fontSize:10}}> · view {e.state} news →</span>}
                </div>
                {e.note && <div style={{fontSize:10.5,color:"#6b7280",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.note}</div>}
              </div>
              <span style={{fontSize:10,fontWeight:700,whiteSpace:"nowrap",
                color: days === 0 ? "#b91c1c" : days <= 7 ? "#d97706" : "#9ca3af"}}>
                {days === 0 ? "TODAY" : days === 1 ? "tomorrow" : `in ${days} days`}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

              <span style={{fontSize:14,color:"#d1d5db",fontWeight:400}}>·</span>
              <span style={{fontSize:18,fontWeight:800,color:"#7c3aed",fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{HOUSE_CURRENT_I}<span style={{fontSize:11,fontWeight:600,marginLeft:2}}>I</span></span>
              <span style={{fontSize:14,color:"#d1d5db",fontWeight:400}}>·</span>
              <span style={{fontSize:15,fontWeight:700,color:"#9ca3af",fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{HOUSE_VACANCIES}<span style={{fontSize:10,fontWeight:500,marginLeft:2}}>vac</span></span>
            </div>
            {/* Segmented bar */}
            <div style={{position:"relative",height:14,borderRadius:6,overflow:"hidden",background:"#f3f4f6",display:"flex"}}>
              <div style={{width:`${(HOUSE_CURRENT_R/435)*100}%`,background:"linear-gradient(90deg,#ef4444,#b91c1c)",transition:"width .8s ease"}}/>
              <div style={{width:`${(HOUSE_CURRENT_I/435)*100}%`,background:"#7c3aed",transition:"width .8s ease"}}/>
              <div style={{width:`${(HOUSE_VACANCIES/435)*100}%`,background:"#e5e7eb",borderLeft:"1px dashed #d1d5db",transition:"width .8s ease"}}/>
              <div style={{width:`${(HOUSE_CURRENT_D/435)*100}%`,background:"linear-gradient(90deg,#3b82f6,#1d4ed8)",transition:"width .8s ease",marginLeft:"auto"}}/>
              {/* Majority line */}
              <div style={{position:"absolute",left:`${(218/435)*100}%`,top:0,bottom:0,width:"2px",
                background:"#d97706",boxShadow:"0 0 4px rgba(217,119,6,.6)",zIndex:2}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:5,fontSize:9,color:"#9ca3af"}}>
              <span>← R majority</span>
              <span style={{color:"#d97706",fontWeight:700}}>218 needed</span>
              <span>D majority →</span>
            </div>
            <div style={{fontSize:10,color:"#9ca3af",marginTop:4}}>
              Kiley (CA-03) caucuses R · {HOUSE_VACANCIES} seats vacant
            </div>
            <div style={{borderTop:"1px solid #f3f4f6",margin:"16px 0 12px"}}/>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:12}}>2026 seats on the ballot</div>
            <BarChart d_count={house.filter(r=>ratingIndex(r.rating)<=2).length}
              r_count={house.filter(r=>ratingIndex(r.rating)>=4).length}
              total={house.length} label={`${house.length} Seats Up`}/>
            <div style={{fontSize:12,color:"#6b7280",marginTop:8,lineHeight:1.8}}>
              <span style={{color:"#d97706",fontWeight:700}}>{houseTossup}</span> Toss-ups &nbsp;·&nbsp;
              <span style={{color:"#1d4ed8",fontWeight:700}}>{house.filter(r=>ratingIndex(r.rating)<=2).length}</span> Lean/Likely D &nbsp;·&nbsp;
              <span style={{color:"#b91c1c",fontWeight:700}}>{house.filter(r=>ratingIndex(r.rating)>=4).length}</span> Lean/Likely R
            </div>
            <div style={{fontSize:10,color:"#9ca3af",marginTop:6,fontStyle:"italic"}}>
              Includes 1 Independent (Kiley, CA-03, caucuses R) · {HOUSE_VACANCIES} vacancies (FL-20, CA-01, GA-14, TX-23, CA-14) · Majority = 218
            </div>
          </div>
        </div>

        {/* ROW 2: Race Map (left) + 3 stat boxes stacked (right) */}
        <div className="two-col fade-up stagger-1" style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:16,marginBottom:16,alignItems:"stretch"}}>
          {/* Race Map */}
          <div className="map-wrap" style={{...cardStyle}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <h3 style={sectionLabel}>RACE MAP</h3>
              <div style={{display:"flex",gap:4}}>
                {[["senate","Senate"],["house","House"],["governors","Govs"]].map(([m,label])=>(
                  <button key={m} onClick={()=>setMapMode(m)} style={{
                    fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:12,border:"1px solid #e5e7eb",
                    background:mapMode===m?"#1a1a2e":"#fff",color:mapMode===m?"#fff":"#6b7280",
                    cursor:"pointer",textTransform:"capitalize"
                  }}>{label}</button>
                ))}
              </div>
            </div>
            <SchematicMap senate={senate} governors={govs} house={house} mapMode={mapMode}/>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:12,justifyContent:"center"}}>
              {RATINGS.map(r=>(
                <div key={r} style={{display:"flex",alignItems:"center",gap:4,fontSize:9,color:"#6b7280"}}>
                  <div style={{width:10,height:10,borderRadius:2,background:MAP_COLORS[r]}}/>
                  {r}
                </div>
              ))}
              <div style={{display:"flex",alignItems:"center",gap:4,fontSize:9,color:"#9ca3af"}}>
                <div style={{width:10,height:10,borderRadius:2,background:"#f0f0f5",border:"1px solid #e0e0e8"}}/>
                Not up in 2026
              </div>
            </div>
          </div>

          {/* 3 stat boxes stacked vertically */}
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <StatBox label="Senate Seats Up" value={senate.length} color="#d97706" sub={`${senateR}R · ${senateD}D up`} delay={0}/>
            <StatBox label="House Seats Up" value={435} color="#1d4ed8" sub={`${HOUSE_CURRENT_R}R · ${HOUSE_CURRENT_D}D up`} delay={.05}/>
            <StatBox label="Governor Races" value={govs.length} color="#7c3aed" sub={`${govs.filter(g=>g.open).length} open seats`} delay={.1}/>
          </div>
        </div>

        {/* Trifecta Snapshot — full width */}
        <div className="fade-up stagger-3" style={{...cardStyle,marginBottom:16}}>
          <h3 style={sectionLabel}>TRIFECTA SNAPSHOT</h3>
          <div style={{display:"flex",alignItems:"flex-start",gap:40,marginBottom:16,flexWrap:"wrap"}}>
            <div>
              <span style={{fontSize:36,fontWeight:800,color:"#ef4444",fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{triR}</span>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:4,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>R Trifectas</div>
            </div>
            <div>
              <span style={{fontSize:36,fontWeight:800,color:"#1d4ed8",fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{triD}</span>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:4,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>D Trifectas</div>
            </div>
            <div>
              <span style={{fontSize:36,fontWeight:800,color:"#7c3aed",fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{triDiv}</span>
              <div style={{fontSize:11,color:"#9ca3af",marginTop:4,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>Divided</div>
            </div>
            <div style={{flex:1,minWidth:200,borderLeft:"2px solid #f3f4f6",paddingLeft:24,display:"flex",alignItems:"center"}}>
              <div style={{fontSize:15,fontWeight:600,color:"#374151",lineHeight:1.5}}>
                🎯 <strong>AZ, MI, WI</strong> chambers could shift trifecta control in 2026
              </div>
            </div>
          </div>
        </div>

        {/* Likely Flips — clickable cards */}
        <div className="fade-up stagger-3" style={{...cardStyle,border:"1px solid #fef3c7",background:"#fffdf5"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <h3 style={{...sectionLabel,color:"#92400e",margin:0}}>
              🔥 MOST LIKELY FLIPS
            </h3>
            <span style={{fontSize:10,color:"#9ca3af"}}>Click any race for deep dive</span>
          </div>
          <div className="three-col" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            {spotlightRaces.length === 0 && <div style={{color:"#9ca3af",fontSize:12,gridColumn:"1/-1"}}>No flip candidates found in current data.</div>}
            {spotlightRaces.map((s,i)=>(
              <FlipCard key={i} race={s} newsData={newsData} onClick={()=>setSelectedFlip(s)}/>
            ))}
          </div>
        </div>

        {/* On Deck */}
        {newsData.filter(n=>n.onDeck).length > 0 && (
          <div className="fade-up stagger-4" style={{...cardStyle,border:"1px solid #fef9c3",background:"#fefce8"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
              <h3 style={{...sectionLabel,color:"#713f12",margin:0}}>📡 ON DECK</h3>
              <span style={{fontSize:10,color:"#9ca3af"}}>Races heating up based on news volume this week</span>
            </div>
            <div className="three-col" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
              {newsData.filter(n=>n.onDeck).map((item,i)=>(
                <OnDeckCard key={i} item={item}/>
              ))}
            </div>
          </div>
        )}

        <ElectionCalendar calendar={calendar} newsAnalysis={newsAnalysis}
          onSelectState={(st)=>{ setNewsState(st); setTab("State News"); window.scrollTo({top:0,behavior:"smooth"}); }}/>

        {/* Flip detail panel */}
        {selectedFlip && (
          <FlipDetailPanel
            race={selectedFlip}
            newsData={newsData}
            onClose={()=>setSelectedFlip(null)}
          />
        )}
      </div>}

      {/* ══════════ SENATE ══════════ */}
      {tab==="State News" && <div className="fade-up">
        <StateNewsTab analysis={newsAnalysis} senate={senate} house={house} govs={govs}
          selected={newsState} onSelect={setNewsState}/>
      </div>}

      {tab==="Senate" && <div>
        <div className="stat-row" style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
          <StatBox label="Seats Up" value={senate.length} color="#d97706" sub={`${senateR}R · ${senateD}D`} delay={0}/>
          <StatBox label="Toss-ups" value={senateTossup} color="#d97706" delay={.05}/>
          <StatBox label="D Need" value="+4" color="#1d4ed8" sub="For majority" delay={.1}/>
          <StatBox label="Competitive" value={senateCompetitive} color="#d97706" delay={.15}/>
        </div>
        <div style={{...cardStyle,marginBottom:14}}>
          <BarChart d_count={senateD} r_count={senateR} total={senate.length} label={`${senate.length} Seats Up`}/>
        </div>
        <div>
          {filterRaces(senate).map((r,i)=><RaceRow key={i} race={r} idx={i}/>)}
          {filterRaces(senate).length===0 && <div style={{color:"#9ca3af",textAlign:"center",padding:40,fontSize:13}}>No races match your filter</div>}
        </div>
      </div>}

      {/* ══════════ HOUSE ══════════ */}
      {tab==="House" && <div>
        <div className="stat-row" style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
          <StatBox label="Competitive Tracked" value={house.length} color="#d97706" delay={0}/>
          <StatBox label="Toss-ups" value={houseTossup} color="#d97706" delay={.05}/>
          <StatBox label="D Need Net" value="+6" color="#1d4ed8" sub="For 218 majority" delay={.1}/>
          <StatBox label="Current" value={`${HOUSE_CURRENT_R}R–${HOUSE_CURRENT_D}D`} color="#ef4444" sub={`+${HOUSE_CURRENT_I}I · ${HOUSE_VACANCIES} vacant`} delay={.15}/>
        </div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:12,fontStyle:"italic"}}>
          Showing competitive races only. 435 total seats; safe seats omitted.
        </div>
        <div>
          {filterRaces(house).map((r,i)=><RaceRow key={i} race={r} showDistrict idx={i}/>)}
          {filterRaces(house).length===0 && <div style={{color:"#9ca3af",textAlign:"center",padding:40,fontSize:13}}>No races match your filter</div>}
        </div>
      </div>}

      {/* ══════════ GOVERNORS ══════════ */}
      {tab==="Governors" && <div>
        <div className="stat-row" style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
          <StatBox label="Races" value={govs.length} color="#7c3aed" sub={`${govs.filter(g=>g.open).length} open seats`} delay={0}/>
          <StatBox label="Toss-ups" value={govTossup} color="#d97706" delay={.05}/>
          <StatBox label="Current Split" value="26R–24D" color="#ef4444" delay={.1}/>
          <StatBox label="Open Seats" value={govs.filter(r=>r.open).length} color="#d97706" delay={.15}/>
        </div>
        <div>
          {filterRaces(govs).map((r,i)=><RaceRow key={i} race={r} idx={i}/>)}
          {filterRaces(govs).length===0 && <div style={{color:"#9ca3af",textAlign:"center",padding:40,fontSize:13}}>No races match your filter</div>}
        </div>
      </div>}

      {/* ══════════ STATE LEGS ══════════ */}
      {tab==="State Legs" && <div>
        <div className="stat-row" style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
          <StatBox label="R Chambers" value={57} color="#ef4444" delay={0}/>
          <StatBox label="D Chambers" value={39} color="#1d4ed8" delay={.05}/>
          <StatBox label="Other/Tied" value={3} color="#7c3aed" sub="AK coalition, MN tied" delay={.1}/>
          <StatBox label="Competitive" value={15} color="#d97706" sub="Per Sabato" delay={.15}/>
        </div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:16}}>
          Showing key battleground state legislatures. Amber borders indicate competitive chambers. Chamber flips affect trifectas and redistricting power.
        </div>
        <div style={{display:"grid",gap:10}}>
          {stLeg.map((s,i)=>{
            const comp = isCompetitive(s.senateRating)||isCompetitive(s.houseRating);
            return <div key={i} className="hover-lift" style={{
              background:"#fff",borderRadius:10,padding:"16px 20px",
              borderLeft:comp?"3px solid #d97706":"3px solid #f3f4f6",
              boxShadow:"0 1px 4px rgba(0,0,0,.05)",
              background:comp?"#fffdf5":"#fff",
            }}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <span style={{fontWeight:800,fontSize:15,color:"#111827"}}>{STATE_NAMES[s.state]||s.state}</span>
                <span style={{fontSize:11,color:"#9ca3af",fontFamily:"'JetBrains Mono',monospace"}}>{s.state}</span>
              </div>
              <div className="two-col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
                <div>
                  <div style={{fontSize:10,color:"#9ca3af",marginBottom:6,fontWeight:700,letterSpacing:".5px"}}>STATE SENATE</div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:13,color:"#374151",fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>{s.senateR}R – {s.senateD}D</span>
                    <span style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,
                      color:s.senateControl==="D"?"#1d4ed8":s.senateControl==="R"?"#b91c1c":"#7c3aed",
                      background:s.senateControl==="D"?"#eff6ff":s.senateControl==="R"?"#fef2f2":"#f5f3ff"}}>
                      {s.senateControl}
                    </span>
                  </div>
                  <RatingBadge rating={s.senateRating}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#9ca3af",marginBottom:6,fontWeight:700,letterSpacing:".5px"}}>STATE HOUSE</div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:13,color:"#374151",fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>{s.houseR}R – {s.houseD}D</span>
                    <span style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,
                      color:s.houseControl==="D"?"#1d4ed8":s.houseControl==="R"?"#b91c1c":"#7c3aed",
                      background:s.houseControl==="D"?"#eff6ff":s.houseControl==="R"?"#fef2f2":"#f5f3ff"}}>
                      {s.houseControl==="Tied"?"TIED":s.houseControl}
                    </span>
                  </div>
                  <RatingBadge rating={s.houseRating}/>
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>}

      {/* ══════════ TRIFECTAS ══════════ */}
      {tab==="Trifectas" && <div>
        <div className="stat-row" style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
          <StatBox label="R Trifectas" value={triR} color="#ef4444" delay={0}/>
          <StatBox label="D Trifectas" value={triD} color="#1d4ed8" delay={.05}/>
          <StatBox label="Divided" value={triDiv} color="#7c3aed" delay={.1}/>
        </div>
        <div style={{fontSize:11,color:"#6b7280",marginBottom:20,lineHeight:1.7}}>
          A trifecta means one party controls the governorship and both legislative chambers — granting sweeping policy and redistricting power.
        </div>

        <div className="fade-up" style={{...cardStyle,border:"1px solid #fef3c7",background:"#fffdf5",marginBottom:20}}>
          <h3 style={{...sectionLabel,color:"#92400e",marginBottom:14}}>POTENTIAL TRIFECTA SHIFTS</h3>
          <div className="two-col" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[
              {state:"AZ",current:"Divided",note:"D holds governor + both chambers Toss-up → could become D trifecta"},
              {state:"MI",current:"Divided",note:"Governor + both chambers competitive → either party could gain trifecta"},
              {state:"WI",current:"Divided",note:"Both chambers Toss-up + open governor → full trifecta possible either way"},
              {state:"GA",current:"R Trifecta",note:"Governor Toss-up. If D wins → becomes Divided"},
              {state:"NH",current:"R Trifecta",note:"House rated Toss-up. D flip → R loses trifecta"},
              {state:"NV",current:"Divided",note:"Governor Toss-up determines policy direction"},
            ].map((t,i)=>(
              <div key={i} className="hover-lift" style={{
                background:"#fff",borderRadius:8,padding:"12px 14px",
                boxShadow:"0 1px 3px rgba(0,0,0,.06)"
              }}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5,gap:4}}>
                  <span style={{fontWeight:700,fontSize:14,color:"#111827"}}>{STATE_NAMES[t.state]}</span>
                  <span style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:4,
                    color:t.current.includes("R")?"#b91c1c":t.current.includes("D")?"#1d4ed8":"#7c3aed",
                    background:t.current.includes("R")?"#fef2f2":t.current.includes("D")?"#eff6ff":"#f5f3ff"
                  }}>{t.current}</span>
                </div>
                <div style={{fontSize:11,color:"#6b7280"}}>{t.note}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(76px,1fr))",gap:5}}>
          {TRIFECTAS.sort((a,b)=>{const o={R:0,Divided:1,D:2};return(o[a.control]??1)-(o[b.control]??1)}).map((t,i)=>(
            <div key={i} className="hover-lift" style={{
              background:t.control==="R"?"#fef2f2":t.control==="D"?"#eff6ff":"#f5f3ff",
              borderRadius:6,padding:"8px 6px",textAlign:"center",
              border:`1px solid ${t.control==="R"?"#fecaca":t.control==="D"?"#bfdbfe":"#ddd6fe"}`
            }}>
              <div style={{fontWeight:800,fontSize:12,color:"#111827",fontFamily:"'JetBrains Mono',monospace"}}>{t.state}</div>
              <div style={{fontSize:9,color:t.control==="R"?"#b91c1c":t.control==="D"?"#1d4ed8":"#7c3aed",fontWeight:700,marginTop:2}}>{t.control}</div>
            </div>
          ))}
        </div>
      </div>}

      {/* FOOTER */}
      <div style={{marginTop:40,paddingTop:16,borderTop:"1px solid #e5e7eb",
        fontSize:10,color:"#9ca3af",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <span>Sources: Cook Political Report, Sabato's Crystal Ball, Inside Elections, Ballotpedia, NCSL</span>
        <span>Data as of May 2026 · Built for deployment on GitHub Pages / Netlify</span>
      </div>
    </main>
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
<script>
/* ── Embed support (Ghost front door — see WEBSITE_PLAN.md) ──────────────
   1. Auto-resize: when framed, posts the page height to the parent so the
      host page's iframe grows to fit (matching listener lives in the Ghost
      HTML card).
   2. Optional gate: once the Ghost site is live, set EMBED_ONLY = true and
      FRONT_DOOR to the gated dashboard page URL; direct visits then bounce
      to the front door. Deterrent, not security. */
(function () {
  var EMBED_ONLY = false; // flip to true once the Ghost site is live
  var FRONT_DOOR = "https://YOUR-GHOST-SITE.ghost.io/dashboard/";
  var framed = window.self !== window.top;
  if (EMBED_ONLY && !framed) { window.location.replace(FRONT_DOOR); return; }
  if (!framed) return;
  // When embedded, drop the full-viewport min-heights so the page reports its
  // true content height — otherwise min-height:100vh inflates scrollHeight and
  // the host iframe over-sizes (blank space below the content).
  document.documentElement.classList.add("is-embedded");
  var mh = document.createElement("style");
  mh.textContent =
    "html.is-embedded,html.is-embedded body,html.is-embedded #root," +
    "html.is-embedded #root>div{min-height:0!important}";
  (document.head || document.documentElement).appendChild(mh);
  var last = 0;
  var post = function () {
    var h = document.documentElement.scrollHeight;
    if (h !== last) {
      last = h;
      parent.postMessage({ type: "ed-resize", height: h }, "*");
    }
  };
  window.addEventListener("load", post);
  window.addEventListener("resize", post);
  new MutationObserver(post).observe(document.documentElement,
    { childList: true, subtree: true });
  setInterval(post, 1500); // catches async chart/CSV renders
})();
</script>
