/* ═══════════════════════════════════════════════════════════════════════════
   GOOGLE SHEETS FETCHER
   ═══════════════════════════════════════════════════════════════════════════ */

async function fetchSheetData(url) {
  if (!url) return null;
  try {
    const resp = await fetch(url);
    const text = await resp.text();
    const parsed = Papa.parse(text, {header:true, skipEmptyLines:true, dynamicTyping:true});
    return parsed.data;
  } catch(e) {
    console.warn("Failed to fetch sheet:", e);
    return null;
  }
}

function parseSenateSheet(rows) {
  return rows.map(r => ({
    state: (r.State||"").trim(),
    incumbent: (r.Incumbent||"").trim(),
    party: (r.Party||"").trim(),
    rating: (r.Rating||"Solid R").trim(),
    open: String(r.Open||"").toLowerCase()==="true" || r.Open===true,
    note: (r.Note||"").trim(),
    challenger: (r.Challenger||"").trim(),
  })).filter(r=>r.state);
}

function parseHouseSheet(rows) {
  return rows.map(r => ({
    state: (r.State||"").trim(),
    district: String(r.District||"").trim().padStart(2,"0"),
    incumbent: (r.Incumbent||"").trim(),
    party: (r.Party||"").trim(),
    rating: (r.Rating||"Solid R").trim(),
    note: (r.Note||"").trim(),
  })).filter(r=>r.state);
}

function parseGovSheet(rows) {
  return rows.map(r => ({
    state: (r.State||"").trim(),
    incumbent: (r.Incumbent||"").trim(),
    party: (r.Party||"").trim(),
    rating: (r.Rating||"Solid R").trim(),
    open: String(r.Open||"").toLowerCase()==="true" || r.Open===true,
    note: (r.Note||"").trim(),
  })).filter(r=>r.state);
}

function parseStateLegSheet(rows) {
  return rows.map(r => ({
    state: (r.State||"").trim(),
    senateControl: (r.SenateControl||"").trim(),
    senateR: Number(r.SenateR)||0,
    senateD: Number(r.SenateD)||0,
    houseControl: (r.HouseControl||"").trim(),
    houseR: Number(r.HouseR)||0,
    houseD: Number(r.HouseD)||0,
    senateRating: (r.SenateRating||"Solid R").trim(),
    houseRating: (r.HouseRating||"Solid R").trim(),
  })).filter(r=>r.state);
}

/* ═══════════════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════════════ */

const ratingIndex = r => RATINGS.indexOf(r);
const isCompetitive = r => ["Lean D","Toss-up","Lean R"].includes(r);
const couldFlip = (rating, party) => {
  if(party==="R" && ratingIndex(rating)<=3) return "blue";
  if(party==="D" && ratingIndex(rating)>=3) return "red";
  return null;
};

    letterSpacing:"0.4px",color:"#f0f0f0",backgroundColor:RATING_COLORS[rating]||"#555",
    whiteSpace:"nowrap",textShadow:"0 1px 2px rgba(0,0,0,.4)"
  }}>{rating}</span>;
}

function PartyDot({party,size=10}) {
  return <span style={{
    display:"inline-block",width:size,height:size,borderRadius:"50%",
    backgroundColor:party==="D"?"#3b82f6":party==="R"?"#ef4444":"#a855f7",
    border:"2px solid rgba(255,255,255,0.12)",flexShrink:0
  }}/>;
}

function StatBox({label,value,color,sub,delay=0}) {
  return <div className={`fade-up hover-lift`} style={{
    background:"rgba(255,255,255,0.03)",borderRadius:12,padding:"18px 22px",
    borderLeft:`3px solid ${color}`,flex:1,minWidth:150,animationDelay:`${delay}s`,
    backdropFilter:"blur(4px)"
  }}>
    <div style={{fontSize:10,color:"#6a6a8a",textTransform:"uppercase",letterSpacing:"1.2px",marginBottom:6,fontWeight:600}}>{label}</div>
    <div style={{fontSize:30,fontWeight:800,color,fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{value}</div>
    {sub && <div style={{fontSize:11,color:"#555",marginTop:6}}>{sub}</div>}
  </div>;
}

function BarChart({d_count,r_count,total,label,majorityLine}) {
  const dPct = (d_count/total)*100;
  const rPct = (r_count/total)*100;
  const otherPct = 100-dPct-rPct;
  const majPct = majorityLine ? (majorityLine/total)*100 : null;
  return <div style={{marginBottom:16}}>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6,color:"#888"}}>
      <span style={{color:"#6aacf0",fontWeight:700}}>D: {d_count}</span>
      <span style={{fontWeight:600,color:"#666"}}>{label}</span>
      <span style={{color:"#f08080",fontWeight:700}}>R: {r_count}</span>
    </div>
    <div style={{position:"relative",height:28,borderRadius:8,overflow:"hidden",background:"#111125"}}>
      <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${dPct}%`,
        background:"linear-gradient(90deg,#0d2855,#2d7ab4)",transition:"width 0.8s ease"}}/>
      {otherPct>0 && <div style={{position:"absolute",left:`${dPct}%`,top:0,bottom:0,width:`${otherPct}%`,
        background:"rgba(255,255,255,0.05)"}}/>}
      <div style={{position:"absolute",right:0,top:0,bottom:0,width:`${rPct}%`,
        background:"linear-gradient(90deg,#d42e2e,#6b1111)",transition:"width 0.8s ease"}}/>
      {majPct && <div style={{position:"absolute",left:`${majPct}%`,top:-2,bottom:-2,width:2,
        background:"#ffd700",zIndex:2,boxShadow:"0 0 8px rgba(255,215,0,.5)"}}/>}
    </div>
    {majorityLine && <div style={{fontSize:10,color:"#b8960a",textAlign:"center",marginTop:4,fontWeight:600}}>
      ▲ {majorityLine} needed for majority
    </div>}
  </div>;
}

function RaceRow({race,showDistrict,idx=0}) {
  const flip = couldFlip(race.rating, race.party);
  return <div className="hover-lift" style={{
    display:"grid",
    gridTemplateColumns:showDistrict?"54px 40px 1fr 110px 120px":"54px 1fr 110px 120px",
    gap:10,alignItems:"center",padding:"11px 16px",
    background:flip?"rgba(255,215,0,0.03)":"rgba(255,255,255,0.015)",
    borderRadius:8,borderLeft:flip?`3px solid #c9a832`:"3px solid transparent",
    marginBottom:3,fontSize:13,transition:"background .2s"
  }}>
    <span style={{fontWeight:800,color:"#d0d0e0",fontFamily:"'JetBrains Mono',monospace",fontSize:14}}>{race.state}</span>
    {showDistrict && <span style={{color:"#555",fontSize:12,fontFamily:"'JetBrains Mono',monospace"}}>{race.district}</span>}
    <div style={{display:"flex",flexDirection:"column",gap:1,minWidth:0}}>
      <span style={{color:"#bbb",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{race.incumbent||"Open"}</span>
      {race.challenger && <span style={{fontSize:10,color:"#6aacf0"}}>vs {race.challenger}</span>}
      {race.note && <span style={{fontSize:10,color:"#555",fontStyle:"italic"}}>{race.note}</span>}
    </div>
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <PartyDot party={race.party}/>
      <span style={{fontSize:11,color:"#666"}}>{race.party}-held</span>
      {race.open && <span style={{fontSize:9,padding:"1px 5px",borderRadius:3,background:"rgba(255,255,255,.06)",color:"#888"}}>OPEN</span>}
    </div>
    <RatingBadge rating={race.rating}/>
  </div>;
}

                    <span style={{fontSize:13,color:"#bbb",fontFamily:"'JetBrains Mono',monospace"}}>{s.houseR}R – {s.houseD}D</span>
                    <span style={{fontSize:10,color:s.houseControl==="D"?"#3b82f6":s.houseControl==="R"?"#ef4444":"#a855f7",
                      fontWeight:700,background:"rgba(255,255,255,.04)",padding:"2px 6px",borderRadius:3}}>
                      {s.houseControl==="Tied"?"TIED":s.houseControl}
                    </span>
                  </div>
                  <RatingBadge rating={s.houseRating}/>
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>}

      {/* ═══════ TRIFECTAS TAB ═══════ */}
      {tab==="Trifectas" && <div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:20}}>
          <StatBox label="R Trifectas" value={triR} color="#ef4444" delay={0}/>
          <StatBox label="D Trifectas" value={triD} color="#3b82f6" delay={.05}/>
          <StatBox label="Divided" value={triDiv} color="#a855f7" delay={.1}/>
        </div>
        <div style={{fontSize:11,color:"#555",marginBottom:20}}>
          A trifecta means one party controls the governorship and both legislative chambers — granting sweeping policy and redistricting power.
        </div>

        <div className="fade-up" style={{background:"rgba(201,168,50,0.04)",borderRadius:12,padding:20,border:"1px solid #2a2a1a",marginBottom:24}}>
          <h3 style={{fontSize:13,fontWeight:700,marginBottom:14,color:"#c9a832",letterSpacing:".5px"}}>POTENTIAL TRIFECTA SHIFTS</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[
              {state:"AZ",current:"Divided",note:"D holds governor + both chambers Toss-up → could become D trifecta"},
              {state:"MI",current:"Divided",note:"Governor + both chambers competitive → either party could gain trifecta"},
              {state:"WI",current:"Divided",note:"Both chambers Toss-up + open governor → full trifecta possible either way"},
              {state:"GA",current:"R Trifecta",note:"Governor Toss-up. If D wins → becomes Divided"},
              {state:"NH",current:"R Trifecta",note:"House rated Toss-up. D flip → R loses trifecta"},
              {state:"NV",current:"Divided",note:"Governor Toss-up determines policy direction"},
            ].map((t,i)=>(
              <div key={i} className="hover-lift" style={{background:"rgba(0,0,0,.25)",borderRadius:8,padding:"12px 14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <span style={{fontWeight:700,fontSize:14,color:"#ddd"}}>{STATE_NAMES[t.state]}</span>
                  <span style={{fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:3,
                    color:t.current.includes("R")?"#ef4444":t.current.includes("D")?"#3b82f6":"#a855f7",
                    background:t.current.includes("R")?"rgba(239,68,68,.1)":t.current.includes("D")?"rgba(59,130,246,.1)":"rgba(168,85,247,.08)"
                  }}>{t.current}</span>
                </div>
                <div style={{fontSize:11,color:"#666"}}>{t.note}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(80px,1fr))",gap:5}}>
          {TRIFECTAS.sort((a,b)=>{const o={R:0,Divided:1,D:2};return(o[a.control]??1)-(o[b.control]??1)}).map((t,i)=>(
            <div key={i} className="hover-lift" style={{
              background:t.control==="R"?"rgba(239,68,68,.06)":t.control==="D"?"rgba(59,130,246,.06)":"rgba(168,85,247,.04)",
              borderRadius:6,padding:"8px 6px",textAlign:"center",
              border:`1px solid ${t.control==="R"?"#2a1111":t.control==="D"?"#111a2a":"#1a1a2a"}`
            }}>
              <div style={{fontWeight:800,fontSize:13,color:"#ddd",fontFamily:"'JetBrains Mono',monospace"}}>{t.state}</div>
              <div style={{fontSize:9,color:t.control==="R"?"#ef4444":t.control==="D"?"#3b82f6":"#a855f7",fontWeight:700,marginTop:2}}>{t.control}</div>
            </div>
          ))}
        </div>
      </div>}

      {/* ═══════ SETTINGS TAB ═══════ */}
      {tab==="Settings" && <div className="fade-up">
        <div style={{background:"rgba(255,255,255,0.025)",borderRadius:12,padding:24,maxWidth:700}}>
          <h3 style={{fontSize:16,fontWeight:700,marginBottom:8,color:"#ddd"}}>Google Sheets Integration</h3>
          <p style={{fontSize:12,color:"#666",marginBottom:20,lineHeight:1.7}}>
            Connect a Google Sheet to update race ratings without editing code. The dashboard will fetch fresh data every time someone opens it.
          </p>

          <div style={{background:"rgba(0,0,0,.3)",borderRadius:8,padding:16,marginBottom:20}}>
            <h4 style={{fontSize:13,fontWeight:700,color:"#c9a832",marginBottom:10}}>Quick Setup (15 minutes)</h4>
            <ol style={{fontSize:12,color:"#aaa",lineHeight:2.2,paddingLeft:20}}>
              <li>Create a new Google Sheet</li>
              <li>Create tabs named: <code style={{color:"#6aacf0",background:"rgba(255,255,255,.05)",padding:"1px 4px",borderRadius:2}}>Senate</code>, <code style={{color:"#6aacf0",background:"rgba(255,255,255,.05)",padding:"1px 4px",borderRadius:2}}>House</code>, <code style={{color:"#6aacf0",background:"rgba(255,255,255,.05)",padding:"1px 4px",borderRadius:2}}>Governors</code>, <code style={{color:"#6aacf0",background:"rgba(255,255,255,.05)",padding:"1px 4px",borderRadius:2}}>StateLeg</code></li>
              <li>Add headers in row 1 (see column specs below)</li>
              <li>Go to <strong style={{color:"#ddd"}}>File → Share → Publish to Web</strong></li>
              <li>Select each tab, choose <strong style={{color:"#ddd"}}>CSV</strong>, click Publish</li>
              <li>Copy each URL into the <code style={{color:"#6aacf0",background:"rgba(255,255,255,.05)",padding:"1px 4px",borderRadius:2}}>SHEET_URLS</code> section at the top of this HTML file</li>
              <li>Save the file and redeploy — done!</li>
            </ol>
          </div>

          <div style={{background:"rgba(0,0,0,.3)",borderRadius:8,padding:16,marginBottom:20}}>
            <h4 style={{fontSize:13,fontWeight:700,color:"#aaa",marginBottom:10}}>Required Columns</h4>
            {[
              {tab:"Senate",cols:"State, Incumbent, Party, Rating, Open, Note, Challenger"},
              {tab:"House",cols:"State, District, Incumbent, Party, Rating, Note"},
              {tab:"Governors",cols:"State, Incumbent, Party, Rating, Open, Note"},
              {tab:"StateLeg",cols:"State, SenateControl, SenateR, SenateD, HouseControl, HouseR, HouseD, SenateRating, HouseRating"},
            ].map((t,i)=>(
              <div key={i} style={{marginBottom:10}}>
                <span style={{fontSize:11,fontWeight:700,color:"#888"}}>{t.tab}:</span>
                <span style={{fontSize:11,color:"#666",marginLeft:8,fontFamily:"'JetBrains Mono',monospace"}}>{t.cols}</span>
              </div>
            ))}
          </div>

          <div style={{background:"rgba(59,130,246,.06)",borderRadius:8,padding:16,border:"1px solid rgba(59,130,246,.15)"}}>
            <h4 style={{fontSize:13,fontWeight:700,color:"#6aacf0",marginBottom:8}}>Current Status</h4>
            <div style={{fontSize:12,color:"#aaa"}}>
              <div style={{marginBottom:4}}>Data source: <strong style={{color:dataSource==="google-sheets"?"#22c55e":"#c9a832"}}>{dataSource==="google-sheets"?"Google Sheets ✓":"Built-in data (no sheet connected)"}</strong></div>
              <div style={{marginBottom:4}}>Senate URL: {SHEET_URLS.senate ? "✓ Connected" : "Not set"}</div>
              <div style={{marginBottom:4}}>House URL: {SHEET_URLS.house ? "✓ Connected" : "Not set"}</div>
              <div style={{marginBottom:4}}>Governors URL: {SHEET_URLS.governors ? "✓ Connected" : "Not set"}</div>
              <div>StateLeg URL: {SHEET_URLS.stateLeg ? "✓ Connected" : "Not set"}</div>
            </div>
          </div>
        </div>

        <div style={{background:"rgba(255,255,255,0.025)",borderRadius:12,padding:24,maxWidth:700,marginTop:20}}>
          <h3 style={{fontSize:16,fontWeight:700,marginBottom:8,color:"#ddd"}}>Rating Scale Reference</h3>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
            {RATINGS.map(r=><div key={r} style={{display:"flex",alignItems:"center",gap:8}}>
              <RatingBadge rating={r}/>
            </div>)}
          </div>
          <p style={{fontSize:11,color:"#555",marginTop:12,lineHeight:1.7}}>
            <strong>Solid:</strong> Not competitive. <strong>Likely:</strong> Not competitive but could engage.{" "}
            <strong>Lean:</strong> Competitive, one party favored. <strong>Toss-up:</strong> Either party could win.
          </p>
        </div>
      </div>}

      {/* FOOTER */}
      <div style={{marginTop:40,paddingTop:16,borderTop:"1px solid #141428",
        fontSize:10,color:"#333",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <span>Sources: Cook Political Report, Sabato's Crystal Ball, Inside Elections, Ballotpedia, NCSL</span>
        <span>Includes April 13 Cook shifts · Built for deployment on GitHub Pages / Netlify</span>
      </div>
    </main>
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
