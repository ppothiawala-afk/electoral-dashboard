name: Weekly Sheet Apply

# Deterministic apply layer of the Electoral Dashboard pipeline.
#
# This job runs the two Python scripts that write to the Google Sheet:
#   1. update_sheet.py          — scrapes ratings + chamber balance
#   2. apply_constants_patch.py — applies the pending constants_patch.json
#
# The RESEARCH / briefing step stays manual in Cowork (skill-triggered). The
# human-in-the-loop model means the user runs research BEFORE Monday, commits
# the resulting constants_patch.json, and this job applies whatever patch is
# committed. That fixes the old sequencing bug where a same-day cron always
# applied last week's stale patch — see README "Weekly rhythm".
#
# Credentials come from the GOOGLE_CREDENTIALS repo secret (base64-encoded
# service-account JSON). update_sheet.get_sheets_service() already prefers this
# env var over the local file, so no service_account.json is needed in CI.

on:
  schedule:
    # Mondays 20:00 UTC == 1:00 PM PT (PDT). GitHub cron is always UTC and does
    # NOT auto-adjust for daylight saving; during PST (winter) this fires at
    # 12:00 PM PT. Acceptable for this pipeline.
    - cron: "0 20 * * 1"
  workflow_dispatch: {}

# Allow the job to push the archived patch / history.json / briefings back.
permissions:
  contents: write

concurrency:
  group: weekly-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: 1THi4cJ8BQNTFjgBhE3myc_F6SvAS0MrqUJ-gpLTmIqA
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail fast if GOOGLE_CREDENTIALS is missing
        run: |
          if [ -z "${GOOGLE_CREDENTIALS}" ]; then
            echo "::error::GOOGLE_CREDENTIALS secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Validate pending patch (if present)
        run: |
          if [ -f constants_patch.json ]; then
            python validate_patch.py constants_patch.json
          else
            echo "No pending constants_patch.json — nothing to validate."
          fi

      - name: Scrape and write ratings + chamber balance
        run: python update_sheet.py --sheet-id "$SHEET_ID"

      - name: Apply pending constants patch
        run: python apply_constants_patch.py --sheet-id "$SHEET_ID"

      # Post-apply verification: re-read the Sheet and assert invariants +
      # that the just-applied patch actually landed. A FAIL reds the run so
      # a silent partial apply can never ship quietly. --local also runs the
      # repo-side checks (news JSON schema/freshness, rating enums, wiring).
      - name: Verify Sheet and repo post-apply
        run: python verify_dashboard.py --local --sheet --sheet-id "$SHEET_ID"

      - name: Commit applied patch, history, and briefings
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the files that the apply step may have changed/created.
          git add -A \
            constants_patch.json \
            constants_patch.applied_*.json \
            history.json \
            weekly_briefing_*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(weekly-apply): apply patch, update history [skip ci]"
            git push
          fi
