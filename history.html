<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electoral Dashboard — Weekly Archive 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#f0f2f5;font-family:'Inter','Segoe UI',sans-serif;color:#1a1a2e;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* Layout */
.header{background:#1a1a2e;color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:13px;opacity:.6;margin-top:2px}
.nav-link{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.nav-link:hover{background:rgba(255,255,255,.2)}

.page{max-width:1200px;margin:0 auto;padding:32px 24px}
.section{margin-bottom:40px}
.section-title{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:#e2e5ea}

/* Week selector */
.week-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.week-tab{padding:8px 16px;border-radius:8px;border:2px solid #e2e5ea;background:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:#6b7280}
.week-tab:hover{border-color:#6366f1;color:#6366f1}
.week-tab.active{border-color:#6366f1;background:#6366f1;color:#fff}

/* Rating timeline table */
.timeline-wrap{overflow-x:auto;border-radius:12px;border:1px solid #e2e5ea;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8f9fb;padding:10px 14px;text-align:left;font-weight:600;font-size:12px;color:#6b7280;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid #e2e5ea;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.race-name{font-weight:600;color:#1a1a2e}
.race-tab{font-size:11px;color:#9ca3af;font-weight:500}

/* Rating pills */
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-solid-d{background:#1d4ed8;color:#fff}
.pill-likely-d{background:#3b82f6;color:#fff}
.pill-lean-d{background:#93c5fd;color:#1e3a5f}
.pill-tossup{background:#f59e0b;color:#fff}
.pill-lean-r{background:#fca5a5;color:#7f1d1d}
.pill-likely-r{background:#ef4444;color:#fff}
.pill-solid-r{background:#b91c1c;color:#fff}
.pill-na{background:#e5e7eb;color:#6b7280}

/* Arrow between ratings */
.arrow{color:#9ca3af;font-size:12px;margin:0 4px}
.moved-d{color:#2563eb}
.moved-r{color:#dc2626}

/* Changes log */
.changes-list{display:flex;flex-direction:column;gap:8px}
.change-card{background:#fff;border:1px solid #e2e5ea;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.change-tab-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.badge-senate{background:#ede9fe;color:#6d28d9}
.badge-house{background:#dcfce7;color:#166534}
.badge-governors{background:#fff7ed;color:#9a3412}
.change-race{font-weight:600;font-size:13px;flex:1;min-width:180px}
.change-move{display:flex;align-items:center;gap:6px;flex-shrink:0}
.change-source{font-size:11px;color:#9ca3af;flex-shrink:0}

/* Chamber balance chart */
.chamber-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.chamber-grid{grid-template-columns:1fr}}
.chamber-card{background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:20px}
.chamber-label{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.balance-bar{height:28px;border-radius:6px;overflow:hidden;display:flex;margin-bottom:10px}
.bar-r{background:#b91c1c;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-weight:700;color:#fff;transition:width .4s}
.bar-i{background:#78716c;display:flex;align-items:center;justify-content:center;padding:0 4px;font-size:11px;font-weight:700;color:#fff;transition:width .4s}
.bar-d{background:#1d4ed8;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:700;color:#fff;transition:width .4s}
.bar-v{background:#e5e7eb;display:flex;align-items:center;padding-left:6px;font-size:11px;font-weight:600;color:#9ca3af;transition:width .4s}
.balance-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.leg{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:2px}
.leg-r{background:#b91c1c}.leg-d{background:#1d4ed8}.leg-i{background:#78716c}.leg-v{background:#e5e7eb;border:1px solid #d1d5db}
.balance-num{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace}
.num-r{color:#b91c1c}.num-d{color:#1d4ed8}.num-sep{color:#9ca3af;font-weight:400}

/* Week timeline (top nav) */
.week-timeline{display:flex;gap:0;background:#fff;border:1px solid #e2e5ea;border-radius:10px;overflow:hidden;margin-bottom:24px}
.wt-item{flex:1;padding:12px 8px;text-align:center;cursor:pointer;transition:background .15s;border-right:1px solid #e2e5ea;position:relative}
.wt-item:last-child{border-right:none}
.wt-item:hover{background:#f8f9fb}
.wt-item.active{background:#f0f1ff}
.wt-date{font-size:13px;font-weight:700;color:#1a1a2e}
.wt-changes{font-size:11px;color:#9ca3af;margin-top:2px}
.wt-dot{width:8px;height:8px;border-radius:50%;background:#6366f1;margin:6px auto 0;opacity:0}
.wt-item.active .wt-dot{opacity:1}

/* Briefing link */
.briefing-link{display:inline-flex;align-items:center;gap:6px;background:#f0f1ff;color:#6366f1;border:1px solid #c7d2fe;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.briefing-link:hover{background:#e0e4ff}

/* Race tracker */
.race-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid #e2e5ea;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#6b7280;transition:all .15s}
.filter-btn:hover,.filter-btn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

.no-changes{color:#9ca3af;font-size:13px;font-style:italic;padding:16px 0}

/* Flipped indicator */
.flip-d::before{content:'⬅ ';color:#2563eb}
.flip-r::before{content:'➡ ';color:#dc2626}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📊 Electoral Dashboard — Weekly Archive</div>
    <div class="header-sub">2026 Midterm Cycle · May 26 – November 3, 2026</div>
  </div>
  <a href="index.html" class="nav-link">← Live Dashboard</a>
</div>

<div class="page">

  <!-- Week selector -->
  <div class="section">
    <div class="section-title">Select Week</div>
    <div class="week-timeline" id="weekTimeline"></div>
  </div>

  <!-- Chamber Balance -->
  <div class="section">
    <div class="section-title">Chamber Balance</div>
    <div class="chamber-grid">
      <div class="chamber-card">
        <div class="chamber-label">U.S. House (435 seats)</div>
        <div class="balance-bar" id="houseBar"></div>
        <div class="balance-legend">
          <div class="leg"><div class="leg-dot leg-r"></div><span id="houseRNum" class="num-r" style="font-weight:700"></span> R</div>
          <div class="leg"><div class="leg-dot leg-i"></div><span id="houseINum" style="font-weight:700;color:#78716c"></span> I</div>
          <div class="leg"><div class="leg-dot leg-d"></div><span id="houseDNum" class="num-d" style="font-weight:700"></span> D</div>
          <div class="leg"><div class="leg-dot leg-v"></div><span id="houseVNum" style="font-weight:700;color:#9ca3af"></span> Vacant</div>
        </div>
        <div style="margin-top:10px;font-size:12px;color:#9ca3af" id="houseNotes"></div>
      </div>
      <div class="chamber-card">
        <div class="chamber-label">U.S. Senate (100 seats)</div>
        <div class="balance-bar" id="senateBar"></div>
        <div class="balance-legend">
          <div class="leg"><div class="leg-dot leg-r"></div><span id="senateRNum" class="num-r" style="font-weight:700"></span> R</div>
          <div class="leg"><div class="leg-dot leg-i"></div><span id="senateINum" style="font-weight:700;color:#78716c"></span> I</div>
          <div class="leg"><div class="leg-dot leg-d"></div><span id="senateDNum" class="num-d" style="font-weight:700"></span> D</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Rating changes this week -->
  <div class="section">
    <div class="section-title">Rating Changes This Week</div>
    <div id="changesList"></div>
  </div>

  <!-- Race tracker — all competitive races over time -->
  <div class="section">
    <div class="section-title">Race Rating Timeline</div>
    <div class="race-filter">
      <button class="filter-btn active" onclick="setTab('All')">All</button>
      <button class="filter-btn" onclick="setTab('Senate')">Senate</button>
      <button class="filter-btn" onclick="setTab('House')">House</button>
      <button class="filter-btn" onclick="setTab('Governors')">Governors</button>
    </div>
    <div class="timeline-wrap">
      <table id="raceTable">
        <thead id="raceHead"></thead>
        <tbody id="raceBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Briefing archive -->
  <div class="section">
    <div class="section-title">Weekly Briefings</div>
    <div id="briefingList" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>

</div>

<script>
// ── Data ────────────────────────────────────────────────────────────────────
const HISTORY_URL = 'history.json';

const RATING_ORDER = ['Solid D','Likely D','Lean D','Toss-up','Lean R','Likely R','Solid R'];

function pillClass(r) {
  const map = {
    'Solid D':'solid-d','Likely D':'likely-d','Lean D':'lean-d',
    'Toss-up':'tossup',
    'Lean R':'lean-r','Likely R':'likely-r','Solid R':'solid-r'
  };
  return 'pill pill-'+(map[r]||'na');
}

function pill(r) {
  if (!r) return '<span class="pill pill-na">—</span>';
  return `<span class="${pillClass(r)}">${r}</span>`;
}

function moveDir(from, to) {
  const fi = RATING_ORDER.indexOf(from), ti = RATING_ORDER.indexOf(to);
  if (fi < 0 || ti < 0) return '';
  return ti < fi ? 'moved-d' : ti > fi ? 'moved-r' : '';
}

// ── State ───────────────────────────────────────────────────────────────────
let data = null;
let selectedWeek = 0;
let activeTab = 'All';

// ── Boot ────────────────────────────────────────────────────────────────────
fetch(HISTORY_URL)
  .then(r => r.json())
  .then(d => { data = d; render(); })
  .catch(() => {
    document.querySelector('.page').innerHTML =
      '<p style="color:#ef4444;padding:40px;text-align:center">Could not load history.json — make sure it is in the same directory as this page.</p>';
  });

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  renderWeekTimeline();
  renderChamber();
  renderChanges();
  renderRaceTable();
  renderBriefings();
}

function setWeek(i) {
  selectedWeek = i;
  renderWeekTimeline();
  renderChamber();
  renderChanges();
}

function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === t));
  renderRaceTable();
}

// Week timeline nav
function renderWeekTimeline() {
  const el = document.getElementById('weekTimeline');
  el.innerHTML = data.weeks.map((w, i) => `
    <div class="wt-item ${i===selectedWeek?'active':''}" onclick="setWeek(${i})">
      <div class="wt-date">${w.label}</div>
      <div class="wt-changes">${w.rating_changes.length} change${w.rating_changes.length!==1?'s':''}</div>
      <div class="wt-dot"></div>
    </div>
  `).join('');
}

// Chamber bars
function renderChamber() {
  const w = data.weeks[selectedWeek].chamber;
  // House
  const hTotal = 435;
  document.getElementById('houseBar').innerHTML = `
    <div class="bar-r" style="width:${w.house_r/hTotal*100}%">${w.house_r}</div>
    <div class="bar-i" style="width:${w.house_i/hTotal*100}%">${w.house_i}</div>
    <div class="bar-d" style="width:${w.house_d/hTotal*100}%">${w.house_d}</div>
    <div class="bar-v" style="width:${w.house_vacancies/hTotal*100}%">${w.house_vacancies>0?w.house_vacancies:''}</div>
  `;
  document.getElementById('houseRNum').textContent = w.house_r;
  document.getElementById('houseINum').textContent = w.house_i;
  document.getElementById('houseDNum').textContent = w.house_d;
  document.getElementById('houseVNum').textContent = w.house_vacancies;
  document.getElementById('houseNotes').textContent = w.notes;

  // Senate
  const sTotal = 100;
  document.getElementById('senateBar').innerHTML = `
    <div class="bar-r" style="width:${w.senate_r/sTotal*100}%">${w.senate_r}</div>
    <div class="bar-i" style="width:${w.senate_i/sTotal*100}%">${w.senate_i}</div>
    <div class="bar-d" style="width:${w.senate_d/sTotal*100}%">${w.senate_d}</div>
  `;
  document.getElementById('senateRNum').textContent = w.senate_r;
  document.getElementById('senateINum').textContent = w.senate_i;
  document.getElementById('senateDNum').textContent = w.senate_d;
}

// Changes log
function renderChanges() {
  const changes = data.weeks[selectedWeek].rating_changes;
  const el = document.getElementById('changesList');
  if (!changes.length) {
    el.innerHTML = '<div class="no-changes">No rating changes recorded this week.</div>';
    return;
  }
  const badgeClass = {Senate:'badge-senate', House:'badge-house', Governors:'badge-governors'};
  el.innerHTML = '<div class="changes-list">' + changes.map(c => {
    const dir = moveDir(c.from, c.to);
    return `
      <div class="change-card">
        <span class="change-tab-badge ${badgeClass[c.tab]||'badge-senate'}">${c.tab}</span>
        <span class="change-race">${c.race}</span>
        <span class="change-move">
          ${pill(c.from)}
          <span class="arrow ${dir}">→</span>
          ${pill(c.to)}
        </span>
        <span class="change-source">${c.source}</span>
      </div>
    `;
  }).join('') + '</div>';
}

// Race rating timeline table — show all weeks as columns
function renderRaceTable() {
  const weeks = data.weeks;
  const head = document.getElementById('raceHead');
  const body = document.getElementById('raceBody');

  head.innerHTML = `<tr>
    <th style="min-width:180px">Race</th>
    ${weeks.map(w=>`<th style="text-align:center">${w.label}</th>`).join('')}
  </tr>`;

  // Collect all races that ever appeared in any changes or snapshot
  // Build a union of all races that moved, keyed by tab+race
  const allRaces = new Map(); // key -> {tab, race, ratings:[]}

  // Seed from all changes
  weeks.forEach((w, wi) => {
    w.rating_changes.forEach(c => {
      const key = c.tab + '|' + c.race;
      if (!allRaces.has(key)) allRaces.set(key, {tab:c.tab, race:c.race, ratings:new Array(weeks.length).fill(null)});
      allRaces.get(key).ratings[wi] = c.to;
      // Also fill "from" on first week if wi > 0
      if (wi > 0 && allRaces.get(key).ratings[wi-1] === null) {
        allRaces.get(key).ratings[wi-1] = c.from;
      }
    });
  });

  // Filter by active tab
  const rows = [...allRaces.values()].filter(r => activeTab === 'All' || r.tab === activeTab);

  // Sort: Senate, House, Governors; within each tab alphabetically
  const tabOrder = {Senate:0, House:1, Governors:2};
  rows.sort((a,b) => (tabOrder[a.tab]||9)-(tabOrder[b.tab]||9) || a.race.localeCompare(b.race));

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="${weeks.length+1}" style="text-align:center;color:#9ca3af;padding:24px;font-style:italic">No races tracked for this filter.</td></tr>`;
    return;
  }

  // Forward-fill ratings
  rows.forEach(r => {
    let last = null;
    for (let i = 0; i < r.ratings.length; i++) {
      if (r.ratings[i] !== null) { last = r.ratings[i]; }
      else if (last !== null) { r.ratings[i] = last; }
    }
  });

  const badgeClass = {Senate:'badge-senate', House:'badge-house', Governors:'badge-governors'};
  body.innerHTML = rows.map(r => `
    <tr>
      <td>
        <div class="race-name">${r.race.replace(/\s*\(.*?\)\s*/,'').trim()}</div>
        <div class="race-tab"><span class="change-tab-badge ${badgeClass[r.tab]||''}" style="font-size:10px">${r.tab}</span></div>
      </td>
      ${r.ratings.map((rating, wi) => {
        const prev = wi > 0 ? r.ratings[wi-1] : null;
        const changed = prev && rating && prev !== rating;
        return `<td style="text-align:center;${changed?'background:#fef9ec':''}">
          ${rating ? pill(rating) : '<span style="color:#e5e7eb">—</span>'}
        </td>`;
      }).join('')}
    </tr>
  `).join('');
}

// Briefing archive
function renderBriefings() {
  const el = document.getElementById('briefingList');
  el.innerHTML = [...data.weeks].reverse().map(w => `
    <a href="${w.briefing}" class="briefing-link" target="_blank">
      <span>📄</span>
      <span>Week of ${w.label} Briefing</span>
      <span style="opacity:.5;font-size:11px">→</span>
    </a>
  `).join('');
}
</script>
</body>
</html>
